
name: Build Conrad Desktop Apps

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Windows — single .exe via PyInstaller --onefile
# ---------------------------------------------------------------------------
jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows executable
        run: >
          pyinstaller
          --noconfirm
          --clean
          --noconsole
          --onefile
          --name ConradKategorisierer
          --icon "assets/app_icon.ico"
          --add-data "assets;assets"
          --add-data "ui;ui"
          --add-data "categorizer;categorizer"
          --hidden-import PySide6.QtSvg
          --hidden-import PySide6.QtXml
          conrad_app.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConradKategorisierer-Windows
          path: dist/ConradKategorisierer.exe

# ---------------------------------------------------------------------------
# macOS — .app bundle via PyInstaller --windowed --onedir (Intel x86_64)
# ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS application (Intel)
        run: >
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name ConradKategorisierer
          --icon "assets/app_icon.icns"
          --add-data "assets:assets"
          --add-data "ui:ui"
          --add-data "categorizer:categorizer"
          --hidden-import PySide6.QtSvg
          --hidden-import PySide6.QtXml
          conrad_app.py

      - name: Package as zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/ConradKategorisierer.app" \
            "dist/ConradKategorisierer-macOS-Intel.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConradKategorisierer-macOS-Intel
          path: dist/ConradKategorisierer-macOS-Intel.zip
